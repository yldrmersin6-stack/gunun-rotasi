<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>500 Seçenekli Arama ve Seçim Sistemi</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f3f4f6;
      color: #1f2937;
      line-height: 1.6;
    }

    /* Üst Menü */
    header {
      background-color: #1e293b;
      color: #ffffff;
      padding: 20px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 20px;
      font-weight: 700;
    }

    /* Ana Konteyner */
    .ana-alan {
      max-width: 700px;
      margin: 50px auto;
      padding: 35px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
    }

    .ana-alan h2 {
      font-size: 24px;
      margin-bottom: 10px;
      color: #0f172a;
    }

    .ana-alan p {
      color: #64748b;
      font-size: 15px;
      margin-bottom: 25px;
    }

    /* 500 Seçenekli Arama Kutusu */
    .arama-kapsayici {
      position: relative;
      margin-bottom: 20px;
    }

    .etiket {
      display: block;
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 8px;
      color: #334155;
    }

    #secenek-arama {
      width: 100%;
      padding: 14px 16px;
      font-size: 16px;
      border: 2px solid #cbd5e1;
      border-radius: 10px;
      outline: none;
      transition: border-color 0.2s;
    }

    #secenek-arama:focus {
      border-color: #2563eb;
    }

    #secenek-listesi {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      max-height: 280px;
      overflow-y: auto;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-top: none;
      border-radius: 0 0 10px 10px;
      box-shadow: 0 12px 20px rgba(0, 0, 0, 0.1);
      z-index: 1000;
      list-style: none;
    }

    #secenek-listesi li {
      padding: 12px 16px;
      font-size: 15px;
      border-bottom: 1px solid #f1f5f9;
      cursor: pointer;
    }

    #secenek-listesi li:hover {
      background-color: #eff6ff;
      color: #1d4ed8;
      font-weight: 500;
    }

    /* Seçim Sonucu ve Form Alanı */
    #secim-karti {
      display: none;
      background-color: #f8fafc;
      border: 1px solid #e2e8f0;
      padding: 20px;
      border-radius: 10px;
      margin-top: 20px;
    }

    #secim-karti h3 {
      font-size: 16px;
      color: #059669;
      margin-bottom: 15px;
    }

    .form-satir {
      margin-bottom: 12px;
    }

    .form-satir input {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 14px;
    }

    .onay-btn {
      width: 100%;
      padding: 14px;
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
    }

    .onay-btn:hover {
      background-color: #1d4ed8;
    }

    #basari-bildirimi {
      display: none;
      margin-top: 15px;
      padding: 14px;
      background-color: #dcfce7;
      color: #166534;
      border-radius: 8px;
      font-weight: 500;
      text-align: center;
    }

    footer {
      text-align: center;
      padding: 20px;
      color: #94a3b8;
      font-size: 13px;
    }
  </style>
</head>
<body>

  <header>
    <h1>Hızlı Seçim & Talep Portalı</h1>
  </header>

  <main class="ana-alan">
    <h2>500 Seçenek Arasından Seçiminizi Yapın</h2>
    <p>Aşağıdaki kutuya yazarak 500 farklı seçenek arasında anında arama yapabilir ve talebinizi iletebilirsiniz.</p>

    <div class="arama-kapsayici">
      <label class="etiket" for="secenek-arama">Seçenek Ara (1 - 500):</label>
      <input type="text" id="secenek-arama" placeholder="Örn: Seçenek 42 yazın veya tıklayın..." autocomplete="off">
      <ul id="secenek-listesi"></ul>
    </div>

    <div id="secim-karti">
      <h3 id="secilen-metin">Seçilen: -</h3>
      <form id="talep-formu">
        <div class="form-satir">
          <input type="text" id="musteri-ad" placeholder="Adınız Soyadınız" required>
        </div>
        <div class="form-satir">
          <input type="tel" id="musteri-tel" placeholder="Telefon Numaranız" required>
        </div>
        <button type="submit" class="onay-btn">Seçimi Onayla ve Gönder</button>
      </form>
    </div>

    <div id="basari-bildirimi">
      Talebiniz başarıyla alındı! En kısa sürede dönüş yapılacaktır.
    </div>
  </main>

  <footer>
    &copy; 2026 Tüm Hakları Saklıdır.
  </footer>

  <script>
    // 500 Seçenekli Veri Havuzu (Kendi listenizi buraya ekleyebilirsiniz)
    const secenekler = Array.from({ length: 500 }, (_, i) => `Seçenek #${i + 1} - Hizmet veya Ürün Detayı`);

    const aramaInput = document.getElementById('secenek-arama');
    const listeUl = document.getElementById('secenek-listesi');
    const secimKarti = document.getElementById('secim-karti');
    const secilenMetin = document.getElementById('secilen-metin');
    const talepFormu = document.getElementById('talep-formu');
    const basariBildirimi = document.getElementById('basari-bildirimi');

    let aktifSecim = "";

    function listeyiGoster(filtre = '') {
      listeUl.innerHTML = '';
      const aranan = filtre.toLocaleLowerCase('tr-TR');
      const sonuclar = secenekler.filter(item => item.toLocaleLowerCase('tr-TR').includes(aranan));

      if (sonuclar.length === 0) {
        const li = document.createElement('li');
        li.textContent = 'Eşleşen seçenek bulunamadı.';
        li.style.color = '#94a3b8';
        listeUl.appendChild(li);
      } else {
        sonuclar.forEach(item => {
          const li = document.createElement('li');
          li.textContent = item;
          li.addEventListener('click', () => {
            aktifSecim = item;
            aramaInput.value = item;
            secilenMetin.textContent = `Seçilen Öğe: ${item}`;
            listeUl.style.display = 'none';
            secimKarti.style.display = 'block';
            basariBildirimi.style.display = 'none';
          });
          listeUl.appendChild(li);
        });
      }
      listeUl.style.display = 'block';
    }

    aramaInput.addEventListener('focus', () => listeyiGoster(aramaInput.value));
    aramaInput.addEventListener('input', (e) => listeyiGoster(e.target.value));

    document.addEventListener('click', (e) => {
      if (!document.querySelector('.arama-kapsayici').contains(e.target)) {
        listeUl.style.display = 'none';
      }
    });

    talepFormu.addEventListener('submit', (e) => {
      e.preventDefault();
      secimKarti.style.display = 'none';
      basariBildirimi.style.display = 'block';
      talepFormu.reset();
      aramaInput.value = '';
    });
  </script>

</body>
</html>
