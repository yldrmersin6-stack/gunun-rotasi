<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Günün Rotası — Editoryal Şehir, Müze & Date Rehberi</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #F9F7F2;
            --card-bg: #FFFFFF;
            --text-main: #1C1B18;
            --text-muted: #6E6A61;
            --accent: #B85D3B;
            --accent-soft: #F7EAE4;
            --border-color: #E8E3D9;
            --tag-bg: #F2EFE9;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            line-height: 1.6;
            padding: 20px 16px 70px;
            max-width: 560px;
            margin: 0 auto;
        }

        /* Üst Başlık */
        header {
            text-align: center;
            margin-bottom: 22px;
            padding-top: 6px;
        }

        .eyebrow {
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-muted);
            font-weight: 600;
            margin-bottom: 6px;
        }

        h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 42px;
            font-weight: 600;
            line-height: 1.1;
            margin-bottom: 8px;
        }

        .subtitle {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: 17px;
            color: var(--text-muted);
        }

        /* Ana Mod Seçici */
        .mode-switcher {
            display: grid;
            grid-template-columns: 1fr 1fr;
            background: var(--card-bg);
            padding: 6px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            margin-bottom: 18px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.03);
        }

        .mode-btn {
            border: none;
            background: transparent;
            padding: 12px;
            border-radius: 12px;
            font-family: inherit;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .mode-btn.active {
            background: var(--text-main);
            color: #FFFFFF;
        }

        /* Yatay Kaydırılabilir Kategori Filtreleri */
        .filter-scroll {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 14px;
            scrollbar-width: none;
        }
        .filter-scroll::-webkit-scrollbar { display: none; }

        .filter-chip {
            white-space: nowrap;
            padding: 8px 14px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            font-family: inherit;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s;
        }

        .filter-chip.active {
            background: var(--accent);
            color: #FFFFFF;
            border-color: var(--accent);
        }

        /* Seçim Kutusu */
        .selector-card {
            background: var(--card-bg);
            padding: 16px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
        }

        .selector-label {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1px;
            color: var(--text-muted);
            text-transform: uppercase;
            display: block;
            margin-bottom: 8px;
        }

        select {
            width: 100%;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-color);
            font-family: inherit;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-main);
            outline: none;
            cursor: pointer;
        }

        /* Ana Rota Kartı */
        .route-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 24px 20px;
            border: 1px solid var(--border-color);
            box-shadow: 0 8px 30px rgba(0,0,0,0.04);
        }

        .card-top-bar {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .badges {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .badge {
            font-size: 11px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 20px;
            background: var(--tag-bg);
            color: var(--text-muted);
        }

        .badge.city {
            background: var(--accent-soft);
            color: var(--accent);
        }

        .fav-btn {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 50%;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 16px;
            transition: transform 0.15s;
        }
        .fav-btn:active { transform: scale(0.9); }

        .route-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 30px;
            font-weight: 600;
            line-height: 1.2;
            margin-bottom: 12px;
        }

        .route-desc {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 18px;
        }

        /* Küratör İpucu Kutusu */
        .curator-note {
            background: var(--accent-soft);
            border-left: 3px solid var(--accent);
            padding: 12px 14px;
            border-radius: 0 12px 12px 0;
            margin-bottom: 20px;
            font-size: 13px;
            color: var(--text-main);
        }
        .curator-note strong {
            color: var(--accent);
            display: block;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 2px;
        }

        /* Metrikler */
        .metrics {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            padding: 14px 0;
            border-top: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 22px;
            text-align: center;
        }

        .metric-item span {
            display: block;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
        }

        .metric-item strong {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-main);
        }

        /* Adım Adım Rota Akışı */
        .timeline-title {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: var(--text-muted);
            margin-bottom: 14px;
            font-weight: 600;
        }

        .step-item {
            display: flex;
            gap: 12px;
            padding: 14px;
            background: var(--bg-color);
            border-radius: 14px;
            margin-bottom: 12px;
            border: 1px solid transparent;
            transition: all 0.2s;
        }

        .step-item.completed {
            opacity: 0.55;
            border-color: var(--border-color);
        }

        .step-checkbox {
            width: 20px;
            height: 20px;
            accent-color: var(--text-main);
            margin-top: 3px;
            cursor: pointer;
        }

        .step-content {
            flex: 1;
        }

        .step-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .step-time {
            font-size: 11px;
            font-weight: 600;
            color: var(--accent);
        }

        .step-type {
            font-size: 10px;
            background: #FFFFFF;
            padding: 2px 8px;
            border-radius: 10px;
            color: var(--text-muted);
            border: 1px solid var(--border-color);
        }

        .step-name {
            font-size: 15px;
            font-weight: 600;
            margin: 4px 0;
        }

        .step-tip {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .map-link {
            display: inline-block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-main);
            text-decoration: none;
            border-bottom: 1px solid var(--text-main);
            padding-bottom: 1px;
        }

        /* Plansız Date Modu */
        .spontaneous-box {
            display: none;
            text-align: center;
        }

        .dice-btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 14px 24px;
            border-radius: 12px;
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-top: 12px;
            transition: transform 0.15s;
        }

        .dice-btn:active { transform: scale(0.98); }

        /* Paylaşım Butonu */
        .share-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            background: var(--text-main);
            color: #FFFFFF;
            border: none;
            padding: 15px;
            border-radius: 14px;
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            margin-top: 20px;
            cursor: pointer;
        }

        footer {
            text-align: center;
            margin-top: 32px;
            font-size: 12px;
            color: var(--text-muted);
        }
    </style>
</head>

    <header>
        <div class="eyebrow">Editoryal Şehir & Kültür Seçkisi</div>

    <!-- Mod Değiştirici -->
    <div class="mode-switcher">
        <button class="mode-btn active" onclick="switchMode('planned', this)">Kürasyon Rotalar</button>
        <button class="mode-btn" onclick="switchMode('spontaneous', this)">Plansız Date Modu ✨</button>
    </div>

    <!-- PLANLI ROTA ALANI -->
    <div id="planned-section">
        <!-- Kategori Filtreleri -->
        <div class="filter-scroll">
            <button class="filter-chip active" onclick="filterRoutes('all', this)">Tümü (8)</button>
            <button class="filter-chip" onclick="filterRoutes('deniz', this)">🌊 Deniz Kenarı</button>
            <button class="filter-chip" onclick="filterRoutes('muze', this)">🎨 Müze & Sanat</button>
            <button class="filter-chip" onclick="filterRoutes('tarih', this)">🏛️ Tarihi Yerler</button>
            <button class="filter-chip" onclick="filterRoutes('fav', this)">❤️ Favorilerim</button>
        </div>

        <div class="selector-card">
            <label class="selector-label" for="route-select">Rotanı Seç:</label>
            <select id="route-select" onchange="loadRoute(this.value)">
                <!-- Seçenekler JS ile kategoriye göre dolacak -->
            </select>
        </div>

        <div class="route-card" id="route-display">
            <!-- Seçili rota detayları buraya gelecek -->
        </div>
    </div>

    <!-- PLANSIZ DATE MODU ALANI -->
    <div id="spontaneous-section" class="route-card spontaneous-box">

        <select id="side-select" style="margin-bottom: 10px;">
            <option value="avrupa">📍 Avrupa Yakası'ndayız</option>
            <option value="anadolu">📍 Anadolu Yakası'ndayız</option>
        </select>

        <select id="vibe-select" style="margin-bottom: 10px;">
            <option value="deniz">🌊 Deniz Havası & Yürüyüş</option>
            <option value="muze">🎨 Müze, Galeri & Kültür</option>
            <option value="tarih">🏛️ Tarihi Doku & Nostalji</option>

        <button class="dice-btn" onclick="generateSpontaneous()">Bize Sürpriz Yap 🎲</button>

        <div id="spontaneous-result" style="margin-top: 20px; text-align: left; display: none;"></div>
    </div>

    <footer>
        Günün Rotası • Bağımsız Şehir Kültürü & Keşif Rehberi

                tempo: "Keyifli",
                steps: [
                    { time: "11:00", type: "Sokak Sanatı", name: "Yeldeğirmeni Duvar Resimleri", tip: "Binaların dış cephelerini süsleyen devasa mural çalışmaları keşfederek sokakları gezin.", map: "https://google.com" },
                    { time: "13:30", type: "Müze Ev", name: "Barış Manço Evi (Moda)", tip: "Sanatçının 19. yüzyıldan kalma tarihi köşkündeki kişisel eşyalarını ve sahne kostümlerini görün.", map: "https://google.com" },
                    { time: "16:00", type: "Deniz Kenarı", name: "Tarihi Moda İskelesi & Sahil", tip: "Restore edilen tarihi iskelede deniz manzarasına karşı kahvenizi yudumlayın.", map: "https://google.com" }
                ]
            },
            buyukada: {
                categories: ['deniz', 'tarih', 'muze'],
                city: "İSTANBUL",
                tag: "Ada Kaçamağı & Tarih",
                title: "Büyükada: Vapur Yolculuğu, Tarihi Köşkler ve Ada Müzesi",
                desc: "Şehirden sadece bir vapur uzaklıkta; arabasız sakin sokaklar, çam ormanları ve mimari harikası ahşap köşkler.",
                curatorTip: "Vapurda mutlaka açık güvertede oturun; martılara simit atarken şehrin silüetinden uzaklaşmak rotanın ilk adımıdır.",
                duration: "Tam Gün (6-7 Saat)",
                budget: "₺₺ (Orta)",
                tempo: "Doğa & Yürüyüş",
                steps: [
                    { time: "10:00", type: "Deniz Yolculuğu", name: "Şehir Hatları Vapur İskelesi", tip: "Kabataş veya Kadıköy'den kalkan vapurla Boğaz ve Marmara havası alarak adaya geçin.", map: "https://google.com" },
                    { time: "11:30", type: "Tarihi Mimari", name: "Çankaya Caddesi Tarihi Köşkleri", tip: "Sıra sıra dizilmiş görkemli 19. yüzyıl ahşap köşklerin mimarisini inceleyerek yürüyün.", map: "https://google.com" },
                    { time: "14:00", type: "Müze", name: "Adalar Müzesi", tip: "Adaların tarihini, eski yazlık kültürünü ve göç hikayelerini anlatan bu modern müzeyi gezin.", map: "https://google.com" },
                    { time: "16:30", type: "Deniz & Manzara", name: "Dilburnu Tabiat Parkı", tip: "Çam ağaçlarının denize indiği koyda gün batımına karşı dinlenin.", map: "https://google.com" }
                ]
            }
        };

        // SPONTANE PLAN HAVUZU (Yaka ve Atmosfere Göre)
        const spontaneousPool = {
            avrupa: {
                deniz: [
                    { title: "Emirgan Sahili & Sakıp Sabancı Müzesi Bahçesi", desc: "Boğaz kıyısında yürüyüp müzenin eşsiz manzaralı bahçesinde kahve molası verin.", map: "https://google.com" },
                    { title: "Yeniköy Sahil Hattı & Köy İçi", desc: "Tarihi yalıların arasından deniz kenarında yürüyüp Yeniköy'ün sakin kafelerinde oturun.", map: "https://google.com" }
                ],
                muze: [
                    { title: "Pera Müzesi & Tepebaşı Yürüyüşü", desc: "Kaplumbağa Terbiyecisi'ni görüp Pera'nın tarihi otellerinin önünden Galata'ya doğru süzülün.", map: "https://google.com" },
                    { title: "Arter (Dolapdere) Çağdaş Sanat Turu", desc: "Türkiye'nin en etkileyici modern sanat müzelerinden birinde ilham verici bir öğleden sonra geçirin.", map: "https://google.com" }
                ],
                tarih: [
                    { title: "Çukurcuma Antikacılar & Masumiyet Müzesi", desc: "Arnavut kaldırımlı tarihi sokaklarda antikacıları gezip Orhan Pamuk'un romanından doğan müzeyi ziyaret edin.", map: "https://google.com" },
                    { title: "Süleymaniye Külliyesi & Tarihi Kuru Fasulyeciler", desc: "Mimar Sinan'ın başyapıtının avlusundan Haliç'i izleyip tarihi sokaklarda yürüyün.", map: "https://google.com" }
                ]
            },
            anadolu: {
                deniz: [
                    { title: "Salacak Sahili & Kız Kulesi Karşısı", desc: "Üsküdar'dan Salacak'a doğru yürüyüp denizin ortasındaki Kız Kulesi'ne karşı çay için.", map: "https://google.com" },
                    { title: "Fenerbahçe Parkı & Kalamış Koyu", desc: "Denizle çevrili yarımadadaki asırlık ağaçların altında yürüyüş yapın.", map: "https://google.com" }
                ],
                muze: [
                    { title: "İstanbul Oyuncak Müzesi (Göztepe)", desc: "Sunay Akın'ın kurduğu tarihi köşkte çocukluğunuza dönüp Göztepe'nin sakin sokaklarını gezin.", map: "https://google.com" },
                    { title: "Müze Gazhane (Hasanpaşa)", desc: "130 yıllık tarihi hava gazı fabrikasından dönüştürülen bu dev kültür-sanat ve iklim müzesini keşfedin.", map: "https://google.com" }
                ],
                tarih: [
                    { title: "Çengelköy Tarihi Çınaraltı & Ara Sokaklar", desc: "Asırlık çınar ağacının altında Boğaz'a karşı çay içip tarihi Çengelköy sokaklarını gezin.", map: "https://google.com" },
                    { title: "Anadolu Hisarı & Göksu Deresi", desc: "İstanbul'un en eski Türk yapısı olan hisarı görüp Göksu Deresi kıyısında yürüyüş yapın.", map: "https://google.com" }
                ]
            }
        };

        let currentRouteKey = 'karakoy';
        let currentFilter = 'all';
        let favorites = JSON.parse(localStorage.getItem('gununRotasiFavs')) || [];

        // Başlangıçta dropdown'ı doldur ve ilk rotayı yükle
        function init() {
            populateSelect('all');
            loadRoute('karakoy');
        }

        function filterRoutes(category, btn) {
            currentFilter = category;
            document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
            btn.classList.add('active');
            populateSelect(category);
        }

        function populateSelect(category) {
            const select = document.getElementById('route-select');
            select.innerHTML = '';

            let filteredKeys = Object.keys(routes).filter(key => {
                if (category === 'all') return true;
                if (category === 'fav') return favorites.includes(key);
                return routes[key].categories.includes(category);
            });

            if (filteredKeys.length === 0) {
                const opt = document.createElement('option');
                opt.textContent = "Bu kategoride henüz kayıtlı rota yok";
                select.appendChild(opt);
                return;
            }

            filteredKeys.forEach(key => {
                const opt = document.createElement('option');
                opt.value = key;
                opt.textContent = `${routes[key].title.split(':')[0]} (${routes[key].tag})`;
                select.appendChild(opt);
            });

            loadRoute(filteredKeys);
        }

        function loadRoute(key) {
            if (!routes[key]) return;
            currentRouteKey = key;
            const data = routes[key];
            const container = document.getElementById('route-display');
            const isFav = favorites.includes(key);

            let stepsHTML = data.steps.map((step, index) => `
                <div class="step-item" id="step-${index}">
                    <input type="checkbox" class="step-checkbox" onchange="toggleStep(${index})">
                    <div class="step-content">
                        <div class="step-header">
                            <span class="step-time">${step.time}</span>
                            <span class="step-type">${step.type}</span>
                        </div>
                        <div class="step-name">${step.name}</div>
                        <div class="step-tip">${step.tip}</div>
                        <a href="${step.map}" target="_blank" class="map-link">Google Haritalar'da Aç ↗</a>
                    </div>
                </div>
            `).join('');

            container.innerHTML = `
                <div class="card-top-bar">
                    <div class="badges">
                        <span class="badge city">${data.city}</span>
                        <span class="badge">${data.tag}</span>
                    </div>
                    <button class="fav-btn" onclick="toggleFavorite('${key}')" title="Favorilere Ekle">
                        ${isFav ? '❤️' : '🤍'}
                    </button>
                </div>

                <h2 class="route-title">${data.title}</h2>
                <p class="route-desc">${data.desc}</p>

                <div class="curator-note">
                    <strong>✨ Küratörün Altın İpucu</strong>
                    ${data.curatorTip}
                </div>
                
                <div class="metrics">
                    <div class="metric-item"><span>Süre</span><strong>${data.duration}</strong></div>
                    <div class="metric-item"><span>Bütçe</span><strong>${data.budget}</strong></div>
                    <div class="metric-item"><span>Tempo</span><strong>${data.tempo}</strong></div>
                </div>

                <div class="timeline-title">Adım Adım Rota Akışı (Tamamladıkça İşaretle)</div>
                ${stepsHTML}

                <button class="share-btn" onclick="shareWhatsApp()">
                    📲 Bu Planı Partnerine / Arkadaşına Gönder
                </button>
            `;
        }

        function toggleFavorite(key) {
            if (favorites.includes(key)) {
                favorites = favorites.filter(item => item !== key);
            } else {
                favorites.push(key);
            }
            localStorage.setItem('gununRotasiFavs', JSON.stringify(favorites));
            loadRoute(key);
        }

        function toggleStep(index) {
            const el = document.getElementById(`step-${index}`);
            el.classList.toggle('completed');
        }

        function switchMode(mode, btn) {
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            if (mode === 'planned') {
                document.getElementById('planned-section').style.display = 'block';
                document.getElementById('spontaneous-section').style.display = 'none';
            } else {
                document.getElementById('planned-section').style.display = 'none';
                document.getElementById('spontaneous-section').style.display = 'block';
            }
        }

        function generateSpontaneous() {
            const side = document.getElementById('side-select').value;
            const vibe = document.getElementById('vibe-select').value;
            const list = spontaneousPool[side][vibe];
            const randomIdea = list[Math.floor(Math.random() * list.length)];
            
            const resultBox = document.getElementById('spontaneous-result');
            resultBox.style.display = 'block';
            resultBox.innerHTML = `
                <div class="step-item" style="background: var(--bg-color); border: 1px solid var(--border-color);">
                    <div class="step-content">
                        <div class="step-header">
                            <span class="step-time">ANLIK KAÇAMAK ÖNERİSİ ✨</span>
                            <span class="step-type">${side.toUpperCase()}</span>
                        </div>
                        <div class="step-name" style="font-size: 17px; margin-top: 6px;">${randomIdea.title}</div>
                        <div class="step-tip">${randomIdea.desc}</div>
                        <a href="${randomIdea.map}" target="_blank" class="map-link">Yol Tarifi Al ↗</a>
                    </div>
                </div>
            `;
        }

        function shareWhatsApp() {
            const data = routes[currentRouteKey];
            const text = `Bugün için harika bir rota buldum! ✨\n\n*${data.title}*\n⏱ Süre: ${data.duration}\n📍 İlk Durak: ${data.steps.name}\n\nDetaylı plan için: ${window.location.href}`;
            const url = `https://wa.me{encodeURIComponent(text)}`;
            window.open(url, '_blank');
        }

        // Uygulamayı başlat
        init();
    </script>
</body>
</html>
